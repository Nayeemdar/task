global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    environment: "development"
    project: "integration_platform"

# ── Scrape targets ────────────────────────────────────────────────────────────
scrape_configs:

  # On-premise integration process (/metrics endpoint served by HealthServer)
  - job_name: "on_prem"
    static_configs:
      - targets:
          - "on_prem:9090"   # Docker Compose service name + internal port
        labels:
          service: "on_prem"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
